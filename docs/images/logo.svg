  <!-- Subtle Acoustic Wave Arcs (Sonar Echolocation Waves) -->
  <path d="M 372 260 A 200 200 0 0 1 652 260" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M 322 220 A 260 260 0 0 1 702 220" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  <path d="M 272 180 A 320 320 0 0 1 752 180" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" opacity="0.15"/>

