  <!-- Precision Cyan Harmonic Accents (Pulse vectors) -->
  <line x1="512" y1="280" x2="512" y2="390" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="512" y1="620" x2="512" y2="710" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <circle cx="512" cy="540" r="4" fill="#00f5ff"/>
  <circle cx="512" cy="710" r="4" fill="#00f5ff"/>
